name: Astro 7 security hardening (one-shot)
on:
  push:
    branches: [security/astro7-platform-migration-2026-11-03]
    paths:
      - .github/workflows/astro7-security-hardening.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/astro7-platform-migration-2026-11-03
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate strict clean install without legacy peer flags
        run: npm ci
      - name: Apply semver-compatible lockfile security corrections
        run: |
          npm audit --json > /tmp/security-before.json || test $? -eq 1
          npm audit --omit=dev --json > /tmp/security-prod-before.json || test $? -eq 1
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund > /tmp/security-fix.txt 2>&1
          status=$?
          set -e
          cat /tmp/security-fix.txt
          if (( status > 1 )); then exit "$status"; fi
          if ! git diff --quiet -- package.json; then
            echo "ERROR: direct dependency manifest changed unexpectedly"
            exit 1
          fi
          npm audit --json > /tmp/security-after.json || test $? -eq 1
          npm audit --omit=dev --json > /tmp/security-prod-after.json || test $? -eq 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const get = (p) => JSON.parse(fs.readFileSync(p, 'utf8')).metadata.vulnerabilities;
          for (const [name, pre, post] of [
            ['all', '/tmp/security-before.json','/tmp/security-after.json'],
            ['production-dependencies','/tmp/security-prod-before.json','/tmp/security-prod-after.json'],
          ]) {
            const a=get(pre),b=get(post);
            console.log(name, JSON.stringify(a), '=>', JSON.stringify(b));
            if (b.total>a.total || b.critical>a.critical || b.high>a.high) process.exitCode=1;
          }
          NODE
      - name: Normalize changed source formatting
        run: |
          npx prettier --write astro.config.ts src/content.config.ts \
            src/components/common/Metadata.astro src/pages/blog/'[slug].astro' \
            src/lib/blog.ts src/utils/images.ts
      - name: Validate full application, SEO artifacts, and CSS generation
        run: |
          npm ci
          npm run check:astro
          npm run check:eslint
          npm run check:ts
          npx vitest run
          npm run build
          test -s dist/client/blog/index.html
          test -s dist/client/rss.xml
          test -s dist/client/sitemap-index.xml
          find dist/client/_astro -name '*.css' -size +30k | grep -q .
      - name: Commit generated lockfile and normalized source
        run: |
          if git diff --quiet -- package-lock.json astro.config.ts src/content.config.ts src/components/common/Metadata.astro src/pages/blog/'[slug].astro' src/lib/blog.ts src/utils/images.ts; then
            echo "No additional changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json astro.config.ts src/content.config.ts \
            src/components/common/Metadata.astro src/pages/blog/'[slug].astro' \
            src/lib/blog.ts src/utils/images.ts
          git commit -m "fix(security): resolve safe transitive patches and format Astro 7 migration"
          git push origin HEAD:refs/heads/security/astro7-platform-migration-2026-11-03
