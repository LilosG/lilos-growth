name: Static build dependency cleanup (one-shot)
on:
  push:
    branches: [security/static-build-slimming-2026-11-03]
    paths: [.github/workflows/static-dependency-cleanup.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/static-build-slimming-2026-11-03
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Baseline security counts
        run: |
          npm ci
          npm audit --json > /tmp/audit-before.json || test $? -eq 1
          npm audit --omit=dev --json > /tmp/audit-prod-before.json || test $? -eq 1
      - name: Remove unused legacy compression integration
        run: |
          npm uninstall astro-compress --no-fund
          npm update --no-fund
          npm ci
      - name: Record security change
        run: |
          npm audit --json > /tmp/audit-after.json || test $? -eq 1
          npm audit --omit=dev --json > /tmp/audit-prod-after.json || test $? -eq 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const counts=(p)=>JSON.parse(fs.readFileSync(p,"utf8")).metadata.vulnerabilities;
          for (const [name,a,b] of [
            ["all","/tmp/audit-before.json","/tmp/audit-after.json"],
            ["production","/tmp/audit-prod-before.json","/tmp/audit-prod-after.json"]
          ]) {
            const before=counts(a),after=counts(b);
            console.log(name,JSON.stringify(before),"=>",JSON.stringify(after));
            if (after.critical>before.critical || after.high>before.high || after.total>before.total) process.exitCode=1;
          }
          NODE
      - name: Validate full static site and schema
        run: |
          npm run check:astro
          npm run check:eslint
          npm run check:ts
          npx vitest run
          npm run build
          node scripts/verify-built-site.mjs
      - name: Commit only npm-managed manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(security): remove obsolete compression integration and update compatible versions"
          git push origin HEAD:refs/heads/security/static-build-slimming-2026-11-03
