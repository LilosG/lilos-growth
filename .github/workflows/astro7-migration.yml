name: Astro 7 migration installer (one-shot)
on:
  push:
    branches: [security/astro7-platform-migration-2026-11-03]
    paths:
      - .github/workflows/astro7-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/astro7-platform-migration-2026-11-03
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve complete platform dependency set (strict peer resolution)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          Object.assign(p.dependencies, {
            '@astrojs/vercel':'11.0.18',
            '@astrojs/rss':'4.0.19',
            '@astrojs/sitemap':'3.7.4',
            'astro-embed':'0.14.0',
            'astro-icon':'1.2.0',
            'zod':'4.6.7'
          });
          Object.assign(p.devDependencies, {
            'astro':'7.4.5',
            '@astrojs/mdx':'8.1.2',
            '@astrojs/check':'0.9.12',
            'astro-compress':'2.4.3',
            'vitest':'5.1.0'
          });
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + String.fromCharCode(10));
          NODE
          # Re-resolve the complete major-version graph; the Astro 5 lockfile cannot satisfy Astro 7 peers.
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps=false --no-fund
          npm install -D --save-exact --legacy-peer-deps=false @astrojs/markdown-remark@latest
      - name: Validate codebase, content, generated pages, and regression tests
        run: |
          npm ci --legacy-peer-deps=false
          npm run check:astro
          npm run check:eslint
          npm run check:ts
          npx vitest run
          npm run build
          test -f dist/client/blog/index.html
          test -f dist/client/sitemap-index.xml
          test -f dist/client/rss.xml
          find dist/client -name '*.css' -size +10k | head -n 4
      - name: Commit npm-resolved manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(security): upgrade Astro 7 platform and verified dependencies"
          git push origin HEAD:refs/heads/security/astro7-platform-migration-2026-11-03
