<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GBP Suspensions &amp; Reinstatements in 2025</title>
  <desc id="desc">Workflow: detect → diagnose → fix → submit → monitor</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2330"/>
      <stop offset="1" stop-color="#263347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="80" y="80" width="1440" height="740" rx="32" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(140,210)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="64" font-weight="800" fill="#ffffff">
      GBP Suspensions &amp; Reinstatements 2025
    </text>
    <rect x="0" y="40" width="560" height="10" rx="5" fill="#66E2D5"/>
    <text x="0" y="120" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="34" font-weight="600" fill="#cfe0ea">
      Prevent issues → Submit once, cleanly → Stand down on edits
    </text>
  </g>
  <!-- flow arrows -->
  <g transform="translate(140,540)" font-family="Inter, system-ui, Segoe UI, Roboto" font-size="22" fill="#d9f7f2" stroke="#66E2D5" stroke-width="2">
    <rect x="0" y="0" width="250" height="70" rx="12" fill="none"/><text x="20" y="44">Detect</text>
    <polygon points="270,35 300,20 300,50" fill="#66E2D5"/>
    <rect x="320" y="0" width="250" height="70" rx="12" fill="none"/><text x="340" y="44">Diagnose</text>
    <polygon points="590,35 620,20 620,50" fill="#66E2D5"/>
    <rect x="640" y="0" width="250" height="70" rx="12" fill="none"/><text x="660" y="44">Fix</text>
    <polygon points="910,35 940,20 940,50" fill="#66E2D5"/>
    <rect x="960" y="0" width="250" height="70" rx="12" fill="none"/><text x="980" y="44">Submit</text>
    <polygon points="1230,35 1260,20 1260,50" fill="#66E2D5"/>
    <rect x="1280" y="0" width="250" height="70" rx="12" fill="none"/><text x="1300" y="44">Monitor</text>
  </g>
</svg>
