<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Lilos Growth</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell",
          sans-serif;
        background: linear-gradient(135deg, #1f2d3d 0%, #27394b 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .container {
        text-align: center;
        max-width: 500px;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 2rem;
        background: #f56b2a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: #ffffff;
      }

      p {
        font-size: 1.125rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 2rem;
      }

      .btn {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: #f56b2a;
        color: #ffffff;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
      }

      .btn:hover {
        background: #e65c1e;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(245, 107, 42, 0.3);
      }

      .status {
        margin-top: 2rem;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
      }

      .online-status {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        margin-right: 0.5rem;
        vertical-align: middle;
      }

      .online-status.online {
        background: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Don't worry—some pages may still be
        available from your cache.
      </p>
      <button class="btn" onclick="window.location.reload()">Try Again</button>
      <div class="status">
        <span class="online-status" id="status-indicator"></span>
        <span id="status-text">Offline</span>
      </div>
    </div>

    <script>
      // Update online/offline status
      function updateOnlineStatus() {
        const statusIndicator = document.getElementById("status-indicator");
        const statusText = document.getElementById("status-text");

        if (navigator.onLine) {
          statusIndicator.classList.add("online");
          statusText.textContent = 'Online - Click "Try Again" to reload';
        } else {
          statusIndicator.classList.remove("online");
          statusText.textContent = "Offline";
        }
      }

      // Listen for online/offline events
      window.addEventListener("online", updateOnlineStatus);
      window.addEventListener("offline", updateOnlineStatus);

      // Initial check
      updateOnlineStatus();

      // Auto-reload when back online
      window.addEventListener("online", () => {
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      });
    </script>
  </body>
</html>
